<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equipo sistemas</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css">

</head>

<body>

    <div class="container mt-5 col-4">
        <h1 class="text-center">Generador nombre equipo</h1>

        <form action="/submit" method="POST" class="mt-5"><!--  aqui se dividen los datos del servidor -->

            <div class="form-group">
                <label for="adjetivo">Cualidad:</label>
                <!-- ten en cuenta esta parte por que el nombre que se le pone a esa clase name"objetivo" se va usar mas adelante -->
                <input type="text" class="form-control" name="adjetivo" required> 
            </div>

            <div class="form-group">
                <label for="mascota">Mascota preferida:</label>
                <!-- ten en cuenta esta parte por que el nombre que se le pone a esa clase name"mascota" se va usar mas adelante -->
                <input type="text" class="form-control" name="mascota" required>
            </div>

            <button type="submit" class="btn btn-primary mt-3">Enviar</button>

        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js"></script>

</body>

</html>
