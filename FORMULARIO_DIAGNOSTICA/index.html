<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="stylesheet.css">
</head>
<body>
    <!-- Mensaje de éxito -->
    <div id="successMessage" class="success-toast">
        <div class="success-content">
            <div class="success-icon">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="10" cy="10" r="9" stroke="white" stroke-width="2"/>
                    <path d="M6 10L9 13L14 7" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <div class="success-text">
                <h3>Message Sent!</h3>
                <p>Thanks for completing the form. We'll be in touch soon!</p>
            </div>
        </div>
    </div>

    <div class="contact-container">
        <h1>Contact Us</h1>
        
        <form id="contactForm" novalidate>
            <div class="form-row">
                <div class="form-group">
                    <label>First Name <span class="required">*</span></label>
                    <input type="text" id="firstName" name="firstName" class="form-input" required>
                    <span class="error-message">This field is required</span>
                </div>
                <div class="form-group">
                    <label>Last Name <span class="required">*</span></label>
                    <input type="text" id="lastName" name="lastName" class="form-input" required>
                    <span class="error-message">This field is required</span>
                </div>
            </div>

            <div class="form-group">
                <label>Email Address <span class="required">*</span></label>
                <input type="email" id="email" name="email" class="form-input" required>
                <span class="error-message">Please enter a valid email address</span>
            </div>

            <div class="form-group">
                <label>Query Type <span class="required">*</span></label>
                <div class="radio-group">
                    <div class="radio-option">
                        <input type="radio" name="queryType" id="general" value="general" required>
                        <label for="general">General Enquiry</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" name="queryType" id="support" value="support" required>
                        <label for="support">Support Request</label>
                    </div>
                </div>
                <span class="error-message">Please select a query type</span>
            </div>

            <div class="form-group">
                <label>Message <span class="required">*</span></label>
                <textarea id="message" name="message" class="form-input" required></textarea>
                <span class="error-message">This field is required</span>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="consent" name="consent" required>
                <label for="consent">I consent to being contacted by the team <span class="required">*</span></label>
            </div>
            <span class="error-message checkbox-error">To submit this form, please consent to being contacted</span>

            <button type="submit" class="submit-btn">Submit</button>
        </form>
    </div>

    <script src="errores.js"></script>
</body>
</html>
